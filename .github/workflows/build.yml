# Builds the website markdown and all public PDF profiles on every push to main.
# The files are available as the "cv" artifact of the workflow run.
# Profiles with `include_internal: true` are skipped so that internal data never
# ends up in artifacts (anyone with read access to the repo can download them).
name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py all --skip-internal
      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: |
            out/*.pdf
            out/*.md
