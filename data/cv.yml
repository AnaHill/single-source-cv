#   - `tags:` are used by PDF profiles to filter list items.
#   - Dates: `start` / `end` as "YYYY-MM" or "YYYY"; `end: present`.
#     `period:` overrides the formatted date range; `date:` -> `date_fmt`.
#   - Inline markdown (**bold**, *italic*, [text](url)) works in text fields
#     and is converted for the PDF automatically.
# =====================================================================

