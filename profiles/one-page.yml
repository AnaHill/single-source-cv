description: Compact 1-page CV with sidebar (condensed academia, link to projects, degrees only)
lang: en
include_internal: false

layout:
  sidebar: [photo, contact, skills, certifications]
  main: [header, summary, experience, projects_link, education, languages]   # projects_link: heading + link to the full list

filters:
  experience:
    exclude_tags: [academia-detail]   # condensed "Academia" entry only
  education:
    include_tags: [degree]

style:
  accent: "#1d4f91"
  font_size: 9
  heading_size: 14
  photo_size: 4.6
