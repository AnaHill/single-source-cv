description: Project-focused CV with all public projects (base for tenders / company CV systems)
lang: en
# Set true for internal use: renders `internal: true` items and `*_internal` fields
# (e.g. client_internal: real customer name instead of "Private Company (NDA)").
# See profiles/internal.yml.
include_internal: false

layout:
  # education in the sidebar: uses the sidebar's free space instead of spilling the main column to a new page
  sidebar: [photo, contact, skills, languages, certifications, education]
  main: [header, summary, experience, projects]

filters:
  experience:
    exclude_tags: [academia-detail]   # condensed "Academia" entry only
  education:
    include_tags: [degree]

style:
  accent: "#1d4f91"
